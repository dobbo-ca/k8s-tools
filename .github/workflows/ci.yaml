name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            dockerfile: containers/full/Dockerfile
            build-args: ""
          - variant: pg-15
            dockerfile: containers/pg/Dockerfile
            build-args: PG_MAJOR=15
          - variant: pg-16
            dockerfile: containers/pg/Dockerfile
            build-args: PG_MAJOR=16
          - variant: pg-17
            dockerfile: containers/pg/Dockerfile
            build-args: PG_MAJOR=17
          - variant: pg-18
            dockerfile: containers/pg/Dockerfile
            build-args: PG_MAJOR=18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ matrix.variant }}-ci
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ matrix.variant }}-ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
